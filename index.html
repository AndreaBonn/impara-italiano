<!DOCTYPE html>
<html lang="pl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impara l'Italiano 🇮🇹 — kurs włoskiego od A1 do C2</title>
<meta name="description" content="Kompletny kurs języka włoskiego po polsku: gramatyka, teoria, ćwiczenia, słuchanie i mówienie. Od A1 do poziomu native.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇮🇹</text></svg>">
</head>
<body>

<a class="skip-link" href="#main">Przejdź do treści</a>

<button class="rail-toggle" id="railToggle" aria-label="Otwórz menu" aria-expanded="false">
  <span class="rail-toggle__bars" aria-hidden="true"></span>
</button>

<div class="shell">

  <!-- ══════════ RAIL ══════════ -->
  <nav class="rail" id="rail" aria-label="Nawigacja główna">
    <div class="rail__head">
      <p class="rail__brand"><span class="rail__flag" aria-hidden="true">🇮🇹</span>Impara l'Italiano</p>
      <p class="rail__tag">Włoski po polsku · A1 → C2</p>
    </div>

    <div class="rail__stats" id="railStats"></div>

    <ul class="rail__menu" id="railMenu">
      <li><button class="rail__item" data-route="percorso"><span class="rail__ico" aria-hidden="true">🗺️</span>Ścieżka nauki</button></li>
      <li><button class="rail__item" data-route="ripasso"><span class="rail__ico" aria-hidden="true">🔁</span>Powtórki<span class="rail__badge" id="dueBadge" hidden>0</span></button></li>
      <li><button class="rail__item" data-route="conversazione"><span class="rail__ico" aria-hidden="true">🎙️</span>Rozmowy na głos</button></li>
      <li><button class="rail__item" data-route="grammatica"><span class="rail__ico" aria-hidden="true">📐</span>Gramatyka</button></li>
      <li><button class="rail__item" data-route="coniugatore"><span class="rail__ico" aria-hidden="true">🧩</span>Odmiana czasowników</button></li>
      <li><button class="rail__item" data-route="lessico"><span class="rail__ico" aria-hidden="true">📖</span>Mój słownik</button></li>
      <li><button class="rail__item" data-route="progressi"><span class="rail__ico" aria-hidden="true">🌸</span>Postępy</button></li>
      <li><button class="rail__item" data-route="impostazioni"><span class="rail__ico" aria-hidden="true">⚙️</span>Ustawienia</button></li>
    </ul>

    <div class="rail__foot">
      <button class="rail__theme" id="themeToggle" aria-label="Przełącz motyw">🌙 Tryb nocny</button>
    </div>
  </nav>

  <div class="rail__scrim" id="railScrim" hidden></div>

  <!-- ══════════ MAIN ══════════ -->
  <main class="main" id="main" tabindex="-1"></main>
</div>

<div class="toast-stack" id="toastStack" aria-live="polite" aria-atomic="false"></div>

<!-- ══════════ SILNIK ══════════ -->
<!-- indeks nagrań musi być wczytany przed audio.js: ten czyta go przy starcie -->
<script src="data/audio-index.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/audio.js"></script>
<script src="assets/js/verbs.js"></script>
<script src="assets/js/exercises.js"></script>
<script src="assets/js/views.js"></script>

<!-- ══════════ DANE ══════════ -->
<!-- warstwa neutralna językowo: struktura, włoski, klucze odpowiedzi -->
<script src="data/core/curriculum-index.js"></script>
<script src="data/core/grammar-reference.js"></script>
<script src="data/core/conversations.js"></script>
<!-- teksty w języku ucznia; app.js scala je zaraz po starcie -->
<script src="data/i18n/pl/curriculum-index.js"></script>
<script src="data/i18n/pl/grammar-reference.js"></script>
<script src="data/i18n/pl/conversations.js"></script>

<!-- ══════════ START ══════════ -->
<script src="assets/js/app.js"></script>
</body>
</html>
