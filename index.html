<!DOCTYPE html>
<html lang="pl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- What this policy REALLY closes: `script-src 'self'` - the execution of code
     this directory did not provide. The course has not a single inline script and
     not a single on*= attribute, so standing at 'self' costs nothing.
     What it does NOT close: style. `style-src` must have 'unsafe-inline', because
     166 places in assets/js build a style="..." attribute out of computed values;
     neither a nonce nor a hash can come into being in a file with no server and no
     build step.
     What it is worth: with no server and no login there is nowhere for XSS to come
     from. What remains is a defence against foreign code attached from outside - a
     browser extension, or a dependency that some day arrives over the network.
     `frame-ancestors` is deliberately absent: browsers ignore it in <meta>, and a
     rule that does nothing looks in the list exactly like one that works. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self' blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title data-i18n="app.title">Impara l'Italiano 🇮🇹 — kurs włoskiego od A1 do C2</title>
<meta name="description" data-i18n-content="app.description" content="Kompletny kurs języka włoskiego po polsku: gramatyka, teoria, ćwiczenia, słuchanie i mówienie. Od A1 do poziomu native.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#b72e42">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇮🇹</text></svg>">
</head>
<body>

<a class="skip-link" href="#main" data-i18n="app.skipToContent">Przejdź do treści</a>

<button class="rail-toggle" id="railToggle" data-i18n-label="app.openMenu" aria-label="Otwórz menu" aria-expanded="false">
  <span class="rail-toggle__bars" aria-hidden="true"></span>
</button>

<div class="shell">

  <!-- ══════════ RAIL ══════════ -->
  <nav class="rail" id="rail" data-i18n-label="app.mainNav" aria-label="Nawigacja główna">
    <div class="rail__head">
      <!-- the course name stays Italian in every language -->
      <p class="rail__brand"><span class="rail__flag" aria-hidden="true">🇮🇹</span>Impara l'Italiano</p>
      <p class="rail__tag" data-i18n="app.tagline">Włoski po polsku · A1 → C2</p>
      <!-- filled by app.js from I18n.LANGS: a new language needs no change in the HTML -->
      <div class="rail__lang" id="langPicker" role="group"></div>
      <button class="rail__search" id="railSearch" data-i18n-label="search.open" aria-label="Szukaj w kursie">
        <span aria-hidden="true">🔍</span><span data-i18n="search.open">Szukaj w kursie</span>
      </button>
    </div>

    <div class="rail__stats" id="railStats"></div>

    <ul class="rail__menu" id="railMenu">
      <li><button class="rail__item" data-route="oggi"><span class="rail__ico" aria-hidden="true">☀️</span><span data-i18n="nav.today">Dziś</span></button></li>
      <li><button class="rail__item" data-route="percorso"><span class="rail__ico" aria-hidden="true">🗺️</span><span data-i18n="nav.path">Ścieżka nauki</span></button></li>
      <li><button class="rail__item" data-route="ripasso"><span class="rail__ico" aria-hidden="true">🔁</span><span data-i18n="nav.review">Powtórki</span><span class="rail__badge" id="dueBadge" hidden>0</span></button></li>
      <li><button class="rail__item" data-route="allenamento"><span class="rail__ico" aria-hidden="true">🎯</span><span data-i18n="nav.train">Trening</span></button></li>
      <li><button class="rail__item" data-route="conversazione"><span class="rail__ico" aria-hidden="true">🎙️</span><span data-i18n="nav.talk">Rozmowy na głos</span></button></li>
      <li><button class="rail__item" data-route="grammatica"><span class="rail__ico" aria-hidden="true">📐</span><span data-i18n="nav.grammar">Gramatyka</span></button></li>
      <li><button class="rail__item" data-route="coniugatore"><span class="rail__ico" aria-hidden="true">🧩</span><span data-i18n="nav.verbs">Odmiana czasowników</span></button></li>
      <li><button class="rail__item" data-route="lessico"><span class="rail__ico" aria-hidden="true">📖</span><span data-i18n="nav.lexicon">Mój słownik</span></button></li>
      <li><button class="rail__item" data-route="shadowing"><span class="rail__ico" aria-hidden="true">🗣️</span><span data-i18n="nav.shadow">Powtarzanie</span></button></li>
      <li><button class="rail__item" data-route="velocita"><span class="rail__ico" aria-hidden="true">⏩</span><span data-i18n="nav.speed">Tempo</span></button></li>
      <li><button class="rail__item" data-route="esame"><span class="rail__ico" aria-hidden="true">📋</span><span data-i18n="nav.exam">Egzamin</span></button></li>
      <li><button class="rail__item" data-route="falsi"><span class="rail__ico" aria-hidden="true">🪤</span><span data-i18n="nav.falsi">Fałszywi przyjaciele</span></button></li>
      <li><button class="rail__item" data-route="copertura"><span class="rail__ico" aria-hidden="true">📊</span><span data-i18n="nav.coverage">Pokrycie</span></button></li>
      <li><button class="rail__item" data-route="progressi"><span class="rail__ico" aria-hidden="true">🌸</span><span data-i18n="nav.progress">Postępy</span></button></li>
      <li><button class="rail__item" data-route="guida"><span class="rail__ico" aria-hidden="true">📖</span><span data-i18n="nav.guide">Przewodnik</span></button></li>
      <li><button class="rail__item" data-route="impostazioni"><span class="rail__ico" aria-hidden="true">⚙️</span><span data-i18n="nav.settings">Ustawienia</span></button></li>
    </ul>

    <div class="rail__foot">
      <button class="rail__theme" id="themeToggle" data-i18n-label="theme.toggle" aria-label="Przełącz motyw">🌙 Tryb nocny</button>
    </div>
  </nav>

  <div class="rail__scrim" id="railScrim" hidden></div>

  <!-- ══════════ MAIN ══════════ -->
  <main class="main" id="main" tabindex="-1"></main>
</div>

<div class="toast-stack" id="toastStack" aria-live="polite" aria-atomic="false"></div>
