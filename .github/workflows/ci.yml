# ============================================================
# The gates that until now existed only when somebody remembered to run
# them. The order goes from the cheapest to the most expensive: validate and
# parity finish in seconds, the DOM tests need a browser and a minute, so an
# error in the data has to report itself earlier.
#
# We do not start a server here: playwright.config.js has its own
# `webServer` (scripts/serve.mjs) with reuseExistingServer switched off.
#
# Node 24, not 20: `npm test` passes the glob "tests/unit/**/*.test.mjs"
# straight to `node --test`, and that only works from Node 21 on.
# ============================================================
name: CI

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest

    # The badges of the last step are committed back to main, and nothing
    # else here writes to the repository.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install the dev dependencies
        run: npm ci

      - name: Browser for the DOM tests
        run: npx playwright install --with-deps chromium

      - name: Code correctness
        run: npm run lint

      - name: Consistency of the course data
        run: node scripts/validate.mjs

      - name: Shape of the language overlays
        run: node scripts/parity.mjs

      - name: Can the worker load what the page loads
        run: node scripts/check_precache.mjs

      # A broken social preview shows up in somebody else's chat window and
      # nowhere else: no test goes red, the course keeps working. This is the
      # only place the failure is visible before a person sees it.
      - name: Can a shared link show a preview
        run: node scripts/check_ogtags.mjs

      # Pages serves 404.html at whatever depth the visitor asked for, so a
      # relative reference in it resolves against a directory that does not
      # exist. That misbehaves only at depths nobody tries by hand.
      - name: Does the not-found page work where it is served
        run: node scripts/check_404.mjs

      # The browser recognises a release by the bytes of sw.js. Without a
      # fresh fingerprint a fix goes out as a release nobody will see, and the
      # student gets no update message.
      - name: Can a new release announce itself
        run: node scripts/check_swversion.mjs

      # `tee` on the three steps below, and nothing else changed about them:
      # the badges of the last step are read off these runs rather than off a
      # second, duplicate one. `set -o pipefail` is what keeps a red suite red
      # through the pipe: without it the exit code would be tee's.
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          npm test | tee reports/unit.log

      # Coverage says a line was executed; this says somebody checks it. An
      # assertion that also passes over an empty result has 100% coverage and
      # zero content — the difference shows only here. It stands before
      # coverage, because it runs two test files rather than the whole suite:
      # ~4 s against ~20 s.
      - name: Can the tests see red
        run: npm run test:mutations

      # A threshold, not a decoration: a refactor that silently unhooks a
      # tested branch from the suite passes "npm test" green and stops here.
      - name: Engine coverage
        shell: bash
        run: |
          set -o pipefail
          node scripts/coverage.mjs --min 99 | tee reports/coverage.txt

      - name: Browser tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: reports/dom.json
        run: npm run test:dom -- --reporter=list,json

      # What the profile page (github.com/AndreaBonn) shows about this
      # repository. The numbers come from the three runs above, so they cannot
      # drift from the suite the way a figure written into a README does.
      - name: Badges for the profile page
        run: |
          node scripts/badges.mjs \
            --unit reports/unit.log \
            --dom reports/dom.json \
            --coverage reports/coverage.txt

      # Only on main, and only on a push: a pull request from a fork has no
      # write token, and a badge built from a branch would describe code that
      # is not released. `[skip ci]` keeps this commit from starting the
      # workflow again.
      - name: Commit the badges
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add badges/test-badge.json badges/coverage-badge.json
          git diff --cached --quiet \
            || git commit -m "ci: update badges [skip ci]"
          git push
