<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impara l'Italiano 🇮🇹 — 20 Poziomów</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#5B4552;
  --paper:#FFF8F3;
  --paper-raised:#FFFFFF;
  --rose:#F6AFC2;
  --rose-deep:#EF87A3;
  --mint:#AEE0C4;
  --mint-deep:#7FC9A0;
  --cream:#FFF0E6;
  --gold:#F0C177;
  --correct:#5CAF83;
  --incorrect:#E67B93;
  --line:#F0DDE3;
  --line-strong:#EBC3D0;
  --sidebar-w:280px;
  --display:'Fredoka', sans-serif;
  --sans:'Quicksand', -apple-system, sans-serif;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:var(--sans);
  font-weight:500;
  color:var(--ink);
  background:var(--paper);
  line-height:1.6;
}
a{color:var(--rose-deep);}

/* ---------- Layout shell ---------- */
.shell{display:flex;min-height:100vh;}

/* ---------- Sidebar ---------- */
.sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:linear-gradient(165deg, var(--rose) 0%, var(--rose-deep) 55%, var(--mint-deep) 130%);
  color:#FFFDF9;
  display:flex;
  flex-direction:column;
  position:sticky;
  top:0;
  height:100vh;
}
.sidebar-head{
  padding:30px 24px 20px;
  border-bottom:1px solid rgba(255,255,255,0.25);
}
.sidebar-head .brand{
  font-family:var(--display);
  font-weight:600;
  font-size:1.55rem;
  margin:0 0 4px;
}
.sidebar-head .flag{font-size:1.1rem;}
.sidebar-head .tagline{
  margin:0;
  font-size:0.85rem;
  color:#FFF0F5;
  font-weight:500;
}
.progress-wrap{padding:18px 24px 20px;border-bottom:1px solid rgba(255,255,255,0.25);}
.progress-label{display:flex;justify-content:space-between;font-size:0.78rem;color:#FFF0F5;margin-bottom:8px;font-weight:600;}
.progress-track{height:10px;background:rgba(255,255,255,0.28);border-radius:20px;overflow:hidden;}
.progress-fill{height:100%;background:var(--gold);width:0%;transition:width .4s ease;border-radius:20px;}

.level-nav{
  flex:1;
  overflow-y:auto;
  padding:14px 12px 24px;
}
.level-btn{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  text-align:left;
  background:rgba(255,255,255,0.08);
  border:none;
  color:#FFFDF9;
  font-family:var(--sans);
  font-weight:600;
  font-size:0.92rem;
  padding:10px 14px;
  border-radius:16px;
  cursor:pointer;
  margin-bottom:6px;
}
.level-btn:hover{background:rgba(255,255,255,0.2);}
.level-btn.active{background:#FFFDF9;color:var(--rose-deep);}
.level-btn .num{
  font-family:var(--display);
  font-weight:600;
  font-size:0.8rem;
  width:22px;
  flex-shrink:0;
  opacity:0.85;
}
.level-btn .check{
  margin-left:auto;
  font-size:0.85rem;
  opacity:0;
}
.level-btn.done .check{opacity:1;}

/* ---------- Main ---------- */
.main{
  flex:1;
  min-width:0;
  padding:48px 56px 100px;
  max-width:900px;
}
.level-header{
  border-bottom:3px dashed var(--rose);
  padding-bottom:20px;
  margin-bottom:34px;
}
.level-meta{
  display:flex;
  gap:8px;
  align-items:center;
  margin-bottom:12px;
}
.tag{
  font-size:0.72rem;
  font-weight:700;
  padding:5px 12px;
  border-radius:20px;
  border:1px solid var(--line-strong);
  color:var(--ink);
  background:var(--cream);
}
.tag.cefr{background:var(--rose-deep);color:#fff;border-color:var(--rose-deep);}
.level-title{
  font-family:var(--display);
  font-weight:600;
  font-size:2.2rem;
  margin:0 0 8px;
  color:var(--rose-deep);
}
.level-sub{
  font-family:var(--sans);
  font-style:normal;
  font-weight:600;
  font-size:1.05rem;
  color:#8A7480;
  margin:0;
}

.section{margin-bottom:40px;}
.section-label{
  font-family:var(--display);
  font-weight:600;
  font-size:1.2rem;
  margin:0 0 14px;
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--ink);
}
.section-label .dot{
  width:12px;height:12px;border-radius:50%;
  background:var(--mint-deep);
  display:inline-block;
}
.theory p{
  max-width:66ch;
  font-size:1.02rem;
  margin:0 0 12px;
}

.grammar-box{
  border:2px solid var(--line-strong);
  background:linear-gradient(180deg, var(--cream) 0%, var(--paper-raised) 100%);
  padding:22px 26px;
  border-radius:22px;
}
.grammar-rule{
  font-weight:700;
  font-family:var(--display);
  font-size:1.05rem;
  margin:0 0 12px;
  color:var(--rose-deep);
}
.grammar-examples{margin:0;padding:0;list-style:none;}
.grammar-examples li{
  font-family:var(--sans);
  font-weight:600;
  font-size:1rem;
  padding:8px 0;
  border-bottom:1px dashed var(--line-strong);
}
.grammar-examples li:last-child{border-bottom:none;}
.grammar-examples .en{
  font-family:var(--sans);
  font-weight:500;
  color:#8A7480;
  font-size:0.88rem;
}

.vocab-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.vocab-item{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:12px 18px;
  font-size:0.95rem;
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:16px;
}
.vocab-item .it{font-weight:700;color:var(--rose-deep);}
.vocab-item .en{color:#8A7480;font-weight:500;}

.exercise{
  border:2px solid var(--line);
  background:var(--paper-raised);
  padding:22px 24px;
  border-radius:22px;
  margin-bottom:18px;
}
.exercise-num{
  font-family:var(--display);
  font-weight:600;
  color:var(--mint-deep);
  font-size:0.85rem;
  margin-bottom:8px;
}
.exercise-prompt{font-size:1rem;margin:0 0 16px;font-weight:600;}
.options{display:flex;flex-direction:column;gap:10px;}
.option{
  display:flex;
  align-items:center;
  gap:10px;
  border:2px solid var(--line-strong);
  background:#fff;
  padding:11px 16px;
  border-radius:16px;
  cursor:pointer;
  font-size:0.95rem;
  font-weight:600;
  transition:border-color .15s, background .15s;
}
.option:hover{border-color:var(--rose-deep);}
.option.selected{border-color:var(--rose-deep);background:#FFF0F5;}
.option.correct{border-color:var(--correct);background:#EAF7EF;}
.option.incorrect{border-color:var(--incorrect);background:#FDEDF0;}
.option input{accent-color:var(--rose-deep);}

.fill-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.fill-row input[type=text]{
  font-family:var(--sans);
  font-weight:600;
  font-size:0.98rem;
  padding:11px 16px;
  border:2px solid var(--line-strong);
  border-radius:16px;
  min-width:220px;
}
.fill-row input[type=text]:focus{outline:none;border-color:var(--rose-deep);}

.check-btn{
  margin-top:16px;
  background:var(--rose-deep);
  color:#fff;
  border:none;
  padding:11px 22px;
  font-family:var(--sans);
  font-weight:700;
  font-size:0.88rem;
  border-radius:20px;
  cursor:pointer;
}
.check-btn:hover{background:#E06E8D;}
.check-btn:disabled{opacity:0.5;cursor:default;}

.feedback{
  margin-top:14px;
  padding:12px 16px;
  border-radius:16px;
  font-size:0.92rem;
  font-weight:600;
  display:none;
}
.feedback.show{display:block;}
.feedback.good{background:#EAF7EF;color:var(--correct);border:2px solid var(--correct);}
.feedback.bad{background:#FDEDF0;color:var(--incorrect);border:2px solid var(--incorrect);}
.feedback .explain{display:block;margin-top:6px;color:var(--ink);font-size:0.88rem;font-weight:500;}

.level-nav-footer{
  display:flex;
  justify-content:space-between;
  margin-top:48px;
  padding-top:22px;
  border-top:1px solid var(--line);
}
.nav-arrow-btn{
  font-family:var(--sans);
  font-weight:700;
  font-size:0.9rem;
  background:var(--cream);
  border:2px solid var(--line-strong);
  padding:11px 20px;
  border-radius:20px;
  cursor:pointer;
  color:var(--ink);
}
.nav-arrow-btn:hover{border-color:var(--rose-deep);color:var(--rose-deep);}
.nav-arrow-btn:disabled{opacity:0.35;cursor:default;}

.mobile-toggle{display:none;}

@media (max-width: 860px){
  .sidebar{position:fixed;left:0;top:0;z-index:20;transform:translateX(-100%);transition:transform .25s ease;box-shadow:2px 0 24px rgba(239,135,163,0.3);}
  .sidebar.open{transform:translateX(0);}
  .main{padding:90px 20px 60px;max-width:100%;}
  .mobile-toggle{
    display:flex;
    position:fixed;top:16px;left:16px;z-index:30;
    background:var(--rose-deep);color:#fff;border:none;
    width:46px;height:46px;border-radius:50%;align-items:center;justify-content:center;
    font-size:1.2rem;cursor:pointer;box-shadow:0 4px 14px rgba(239,135,163,0.4);
  }
  .vocab-grid{grid-template-columns:1fr;}
  .level-title{font-size:1.7rem;}
}
</style>
</head>
<body>

<button class="mobile-toggle" id="mobileToggle" aria-label="Przełącz menu poziomów">☰</button>

<div class="shell">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <p class="brand"><span class="flag">🇮🇹</span> Impara l'Italiano</p>
      <p class="tagline">20 poziomów · A1 → A2 · wyjaśnienia po polsku 🎀</p>
    </div>
    <div class="progress-wrap">
      <div class="progress-label"><span>Postęp ogólny</span><span id="progressPct">0%</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="level-nav" id="levelNav"></div>
  </nav>

  <main class="main" id="main"></main>
</div>

<script>
/* ============ DANE POZIOMÓW ============ */
const LEVELS = [
{
  id:1, cefr:"A1", theme:"Powitania", title:"Buongiorno!",
  sub:"Powitania i czasownik essere (być)",
  theory:[
    "Włoskie powitania zmieniają się w zależności od pory dnia oraz od tego, jak formalnie musisz się wyrażać. Buongiorno obejmuje ranek i wczesne popołudnie, buonasera przejmuje rolę wieczorem, a ciao to uniwersalne, nieformalne „cześć\" i „pa\", którego używasz ze znajomymi, rodziną czy rówieśnikami.",
    "Czasownik essere („być\") to jeden z dwóch najważniejszych czasowników włoskich — będziesz go używać nieustannie, opisując tożsamość, pochodzenie i stan. Jak większość włoskich czasowników, jego formy zmieniają się całkowicie dla każdej osoby, więc trzeba je zapamiętać, a nie odgadywać."
  ],
  grammar:{
    rule:"Essere (być) — czas teraźniejszy",
    examples:[
      ["io sono","ja jestem"],["tu sei","ty jesteś (nieformalnie)"],["lui/lei è","on/ona jest"],
      ["noi siamo","my jesteśmy"],["voi siete","wy jesteście"],["loro sono","oni/one są"]
    ]
  },
  vocab:[["ciao","cześć / pa"],["buongiorno","dzień dobry (rano)"],["buonasera","dobry wieczór"],["arrivederci","do widzenia (formalnie)"],["come stai?","jak się masz? (nieformalnie)"],["come sta?","jak się Pan/Pani ma?"],["bene, grazie","dobrze, dziękuję"],["piacere","miło Cię poznać"]],
  exercises:[
    {type:"mcq",prompt:"Jakiego powitania użyjesz, wchodząc do sklepu o 9 rano?",options:["Buonasera","Buongiorno","Ciao ciao"],answer:1,explain:"Buongiorno używa się od rana do wczesnego popołudnia; buonasera przejmuje rolę wieczorem."},
    {type:"mcq",prompt:"Jak powiedzieć „my jesteśmy\" po włosku?",options:["loro sono","noi siamo","voi siete"],answer:1,explain:"Noi siamo = my jesteśmy. Loro sono to „oni/one są\", a voi siete to „wy jesteście\"."},
    {type:"fill",prompt:"Uzupełnij: „Io ___ italiano.” (Jestem Włochem.)",answer:"sono",hint:"pierwsza osoba liczby pojedynczej czasownika essere",explain:"Io sono to forma pierwszej osoby czasownika essere — „ja jestem\"."},
    {type:"fill",prompt:"Przetłumacz: „Miło Cię poznać”",answer:"piacere",explain:"Piacere używa się w momencie poznania kogoś."}
  ]
},
{
  id:2, cefr:"A1", theme:"Podstawy gramatyki", title:"Il, lo, la…",
  sub:"Rodzaj oraz rodzajniki określone/nieokreślone",
  theory:[
    "Każdy włoski rzeczownik ma rodzaj — męski lub żeński — co wpływa niemal na wszystko, co się z nim wiąże: rodzajniki, przymiotniki, a nawet niektóre formy czasownika, które poznasz później. Zasada kciuka: rzeczowniki kończące się na -o są zwykle rodzaju męskiego, a te kończące się na -a — żeńskiego, choć są wyjątki.",
    "Rodzajnik określony („the\") ma kilka form w zależności od rodzaju, liczby i głoski, od której zaczyna się rzeczownik. Na pierwszy rzut oka wygląda to na dużo do zapamiętania naraz, ale wzorzec szybko staje się automatyczny dzięki praktyce."
  ],
  grammar:{
    rule:"Rodzajniki określone (the)",
    examples:[
      ["il libro","książka (r. męski)"],["lo studente","student (r. męski, przed s+spółgłoska/z)"],
      ["la casa","dom (r. żeński)"],["l'amico / l'amica","przyjaciel/przyjaciółka (przed samogłoską)"],
      ["i libri","książki (l.mn. r. męski)"],["gli studenti","studenci (przypadek specjalny)"],
      ["le case","domy (l.mn. r. żeński)"]
    ]
  },
  vocab:[["il libro","książka"],["la casa","dom"],["lo zaino","plecak"],["l'amico","przyjaciel"],["l'amica","przyjaciółka"],["un ragazzo","chłopak"],["una ragazza","dziewczyna"],["uno studente","student"]],
  exercises:[
    {type:"mcq",prompt:"Który rodzajnik pasuje do „casa” (dom)?",options:["il","la","lo"],answer:1,explain:"Casa kończy się na -a i jest rodzaju żeńskiego, więc bierze la."},
    {type:"mcq",prompt:"„Zaino” (plecak) zaczyna się na z, więc bierze...",options:["il","lo","l'"],answer:1,explain:"Rzeczowniki męskie zaczynające się na z lub s+spółgłoska biorą lo zamiast il."},
    {type:"fill",prompt:"Uzupełnij: „___ amico” (przyjaciel, r. męski, przed samogłoską)",answer:"l'",explain:"Przed samogłoską il/la ściągają się do l' — l'amico, l'amica."},
    {type:"fill",prompt:"Liczba mnoga od „il libro” to „___ libri”.",answer:"i",explain:"Rzeczowniki męskie w l.mn. zwykle biorą rodzajnik i: il libro → i libri."}
  ]
},
{
  id:3, cefr:"A1", theme:"Podstawy gramatyki", title:"Avere e i numeri",
  sub:"Czasownik avere (mieć) i liczby 0–20",
  theory:[
    "Avere („mieć\") to drugi kluczowy czasownik, a włoski opiera się na nim tam, gdzie polski by tego nie oczekiwał — ho fame znaczy dosłownie „mam głód\", podczas gdy powiedzielibyśmy „jestem głodny\". Podobnych wyrażeń z avere poznasz jeszcze wiele.",
    "Liczby to podstawowe słownictwo: przydadzą Ci się do cen, wieku, numerów telefonu i podawania godziny. Naucz się najpierw solidnie 0–20, bo liczby 21–100 buduje się głównie przez ich łączenie."
  ],
  grammar:{
    rule:"Avere (mieć) — czas teraźniejszy",
    examples:[
      ["io ho","ja mam"],["tu hai","ty masz"],["lui/lei ha","on/ona ma"],
      ["noi abbiamo","my mamy"],["voi avete","wy macie"],["loro hanno","oni/one mają"]
    ]
  },
  vocab:[["zero","0"],["uno","1"],["due","2"],["tre","3"],["quattro","4"],["cinque","5"],["sei","6"],["sette","7"],["otto","8"],["nove","9"],["dieci","10"],["ho fame","jestem głodny/a"],["ho sete","chce mi się pić"],["ho ... anni","mam ... lat"]],
  exercises:[
    {type:"mcq",prompt:"Jak powiedzieć „oni mają”?",options:["loro hanno","loro sono","noi abbiamo"],answer:0,explain:"Loro hanno = oni mają. Loro sono znaczyłoby „oni są” (essere, nie avere)."},
    {type:"mcq",prompt:"Co dosłownie znaczy „ho fame” i jak to rozumieć?",options:["mam głód → jestem głodny/a","jestem głodem → jestem zły/a","mam głodny → bez sensu"],answer:0,explain:"Avere używa się do stanów fizycznych jak głód czy pragnienie."},
    {type:"fill",prompt:"Zapisz cyfrę dla „sette”:",answer:"7",explain:"Sette = siedem (7)."},
    {type:"fill",prompt:"Uzupełnij: „Noi ___ due gatti.” (Mamy dwa koty.)",answer:"abbiamo",explain:"Noi abbiamo = my mamy, pierwsza osoba l.mn. czasownika avere."}
  ]
},
{
  id:4, cefr:"A1", theme:"Podstawy gramatyki", title:"Aggettivi e colori",
  sub:"Zgodność przymiotników, na przykładzie kolorów",
  theory:[
    "Włoskie przymiotniki zwykle stoją po rzeczowniku i — podobnie jak sam rzeczownik — zmieniają końcówkę, by dopasować się do rodzaju i liczby. Większość przymiotników ma prosty wzorzec -o/-a/-i/-e, choć kilka (jak verde, „zielony\") ma tę samą formę dla obu rodzajów.",
    "Kolory to świetny sposób na ćwiczenie tej zgodności, bo będziesz ich używać bardzo często, a wzorzec jest bardzo regularny."
  ],
  grammar:{
    rule:"Zgodność przymiotników (wzorzec -o/-a/-i/-e)",
    examples:[
      ["il libro rosso","czerwona książka (r. m., l.poj.)"],["la casa rossa","czerwony dom (r. ż., l.poj.)"],
      ["i libri rossi","czerwone książki (l.mn.)"],["le case rosse","czerwone domy (l.mn.)"],
      ["la maglia verde","zielona koszulka (przymiotnik nieodmienny -e)"]
    ]
  },
  vocab:[["rosso/a","czerwony/a"],["blu","niebieski (nieodmienny)"],["verde","zielony/a"],["giallo/a","żółty/a"],["nero/a","czarny/a"],["bianco/a","biały/a"],["grande","duży/a"],["piccolo/a","mały/a"]],
  exercises:[
    {type:"mcq",prompt:"„La macchina” (samochód, r. żeński) jest czerwony. Jak napiszesz „czerwony”?",options:["rosso","rossa","rossi"],answer:1,explain:"Macchina jest rodzaju żeńskiego l.poj., więc przymiotnik bierze końcówkę -a: rossa."},
    {type:"mcq",prompt:"Który przymiotnik koloru NIE zmienia się między rodzajami?",options:["rosso","verde","nero"],answer:1,explain:"Verde kończy się na -e — ta klasa przymiotników ma tę samą formę dla obu rodzajów."},
    {type:"fill",prompt:"„I libri ___.” (czarne książki, l.mn. r. męski)",answer:"neri",explain:"Nero → neri w liczbie mnogiej rodzaju męskiego."},
    {type:"fill",prompt:"„La casa è ___.” (dom jest duży, r. żeński)",answer:"grande",explain:"Grande kończy się na -e, więc forma jest taka sama dla obu rodzajów."}
  ]
},
{
  id:5, cefr:"A1", theme:"Podstawy gramatyki", title:"Verbi in -ARE",
  sub:"Regularne czasowniki na -are w czasie teraźniejszym",
  theory:[
    "Włoskie czasowniki dzielą się na trzy grupy według końcówki bezokolicznika: -are, -ere i -ire. Grupa -are jest największa i najbardziej regularna — gdy nauczysz się wzorca na przykładzie parlare („mówić\"), odmienisz tak setki innych czasowników.",
    "Zauważ, że włoski przez większość czasu nie potrzebuje zaimków osobowych (io, tu, lui...), bo końcówka czasownika sama mówi, kto wykonuje czynność. Rodzimi użytkownicy zwykle je pomijają, chyba że są potrzebne dla podkreślenia lub jasności."
  ],
  grammar:{
    rule:"Parlare (mówić) — wzorzec -ARE",
    examples:[
      ["parlo","ja mówię"],["parli","ty mówisz"],["parla","on/ona mówi"],
      ["parliamo","my mówimy"],["parlate","wy mówicie"],["parlano","oni/one mówią"]

/* ============ STAN ============ */
const STORAGE_KEY = "impara-italiano-progress-pl";
let progress = {};
try{ progress = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }catch(e){ progress = {}; }
let currentLevel = 1;

function saveProgress(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }catch(e){}
}
function isLevelDone(id){
  const lvl = LEVELS.find(l=>l.id===id);
  if(!lvl) return false;
  const done = progress[id];
  return done && done.length === lvl.exercises.length && done.every(Boolean);
}

/* ============ RENDER: SIDEBAR ============ */
function renderSidebar(){
  const nav = document.getElementById("levelNav");
  nav.innerHTML = "";
  LEVELS.forEach(lvl=>{
    const btn = document.createElement("button");
    btn.className = "level-btn" + (lvl.id===currentLevel ? " active":"") + (isLevelDone(lvl.id) ? " done":"");
    btn.innerHTML = `<span class="num">${String(lvl.id).padStart(2,'0')}</span><span>${lvl.title}</span><span class="check">✓</span>`;
    btn.addEventListener("click", ()=>{ goToLevel(lvl.id); document.getElementById("sidebar").classList.remove("open"); });
    nav.appendChild(btn);
  });
  updateOverallProgress();
}

function updateOverallProgress(){
  const doneCount = LEVELS.filter(l=>isLevelDone(l.id)).length;
  const pct = Math.round((doneCount / LEVELS.length) * 100);
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressPct").textContent = pct + "%";
}

/* ============ RENDER: MAIN ============ */
function renderLevel(id){
  const lvl = LEVELS.find(l=>l.id===id);
  const main = document.getElementById("main");
  if(!progress[id]) progress[id] = new Array(lvl.exercises.length).fill(false);

  let html = `
  <div class="level-header">
    <div class="level-meta">
      <span class="tag cefr">${lvl.cefr}</span>
      <span class="tag">${lvl.theme}</span>
    </div>
    <h1 class="level-title">Poziom ${lvl.id} — ${lvl.title}</h1>
    <p class="level-sub">${lvl.sub}</p>
  </div>

  <div class="section">
    <h2 class="section-label"><span class="dot"></span>Teoria</h2>
    <div class="theory">${lvl.theory.map(p=>`<p>${p}</p>`).join("")}</div>
  </div>

  <div class="section">
    <h2 class="section-label"><span class="dot"></span>Gramatyka</h2>
    <div class="grammar-box">
      <p class="grammar-rule">${lvl.grammar.rule}</p>
      <ul class="grammar-examples">
        ${lvl.grammar.examples.map(ex=>`<li>${ex[0]} <span class="en">— ${ex[1]}</span></li>`).join("")}
      </ul>
    </div>
  </div>

  <div class="section">
    <h2 class="section-label"><span class="dot"></span>Słownictwo</h2>
    <div class="vocab-grid">
      ${lvl.vocab.map(v=>`<div class="vocab-item"><span class="it">${v[0]}</span><span class="en">${v[1]}</span></div>`).join("")}
    </div>
  </div>

  <div class="section">
    <h2 class="section-label"><span class="dot"></span>Ćwiczenia</h2>
    ${lvl.exercises.map((ex,i)=>renderExercise(lvl,ex,i)).join("")}
  </div>

  <div class="level-nav-footer">
    <button class="nav-arrow-btn" id="prevBtn" ${lvl.id===1?"disabled":""}>← Poprzedni poziom</button>
    <button class="nav-arrow-btn" id="nextBtn" ${lvl.id===LEVELS.length?"disabled":""}>Następny poziom →</button>
  </div>
  `;
  main.innerHTML = html;
  window.scrollTo({top:0, behavior:"instant" in window ? "instant":"auto"});

  lvl.exercises.forEach((ex,i)=> wireExercise(lvl, ex, i));

  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  if(prevBtn) prevBtn.addEventListener("click", ()=> goToLevel(lvl.id-1));
  if(nextBtn) nextBtn.addEventListener("click", ()=> goToLevel(lvl.id+1));
}

function renderExercise(lvl, ex, i){
  const exId = `l${lvl.id}e${i}`;
  if(ex.type === "mcq"){
    return `
    <div class="exercise" id="${exId}">
      <p class="exercise-num">Ćwiczenie ${i+1} — wybór</p>
      <p class="exercise-prompt">${ex.prompt}</p>
      <div class="options">
        ${ex.options.map((opt,oi)=>`
          <label class="option" data-idx="${oi}">
            <input type="radio" name="${exId}" value="${oi}"> <span>${opt}</span>
          </label>`).join("")}
      </div>
      <button class="check-btn" data-ex="${exId}">Sprawdź odpowiedź</button>
      <div class="feedback" id="${exId}-fb"></div>
    </div>`;
  } else {
    return `
    <div class="exercise" id="${exId}">
      <p class="exercise-num">Ćwiczenie ${i+1} — uzupełnij lukę</p>
      <p class="exercise-prompt">${ex.prompt}</p>
      <div class="fill-row">
        <input type="text" id="${exId}-input" placeholder="Wpisz odpowiedź po włosku" autocomplete="off">
        <button class="check-btn" data-ex="${exId}">Sprawdź odpowiedź</button>
      </div>
      <div class="feedback" id="${exId}-fb"></div>
    </div>`;
  }
}

function wireExercise(lvl, ex, i){
  const exId = `l${lvl.id}e${i}`;
  const container = document.getElementById(exId);
  const btn = container.querySelector(".check-btn");
  const fb = document.getElementById(exId+"-fb");

  if(ex.type === "mcq"){
    const options = container.querySelectorAll(".option");
    options.forEach(opt=>{
      opt.addEventListener("click", ()=>{
        options.forEach(o=>o.classList.remove("selected"));
        opt.classList.add("selected");
      });
    });
    btn.addEventListener("click", ()=>{
      const checked = container.querySelector("input[type=radio]:checked");
      if(!checked){ return; }
      const idx = parseInt(checked.value,10);
      const correct = idx === ex.answer;
      options.forEach((o,oi)=>{
        o.classList.remove("correct","incorrect");
        if(oi === ex.answer) o.classList.add("correct");
        else if(oi === idx && !correct) o.classList.add("incorrect");
      });
      showFeedback(fb, correct, ex.explain);
      markDone(lvl.id, i, correct);
    });
  } else {
    const input = document.getElementById(exId+"-input");
    btn.addEventListener("click", ()=>{
      const val = (input.value || "").trim().toLowerCase().replace(/[.!?]/g,"");
      const target = ex.answer.toLowerCase();
      const correct = val === target;
      showFeedback(fb, correct, ex.explain, correct ? null : ex.answer);
      markDone(lvl.id, i, correct);
    });
    input.addEventListener("keydown", (e)=>{ if(e.key==="Enter") btn.click(); });
  }
}

function showFeedback(fb, correct, explain, correctAnswer){
  fb.className = "feedback show " + (correct ? "good":"bad");
  const head = correct ? "Brawo! 🎉" : (correctAnswer ? `Niezupełnie — poprawna odpowiedź: „${correctAnswer}”` : "Niezupełnie.");
  fb.innerHTML = `${head}<span class="explain">${explain}</span>`;
}

function markDone(levelId, exIndex, correct){
  if(!progress[levelId]) progress[levelId] = [];
  progress[levelId][exIndex] = correct;
  saveProgress();
  renderSidebar();
}

function goToLevel(id){
  if(id < 1 || id > LEVELS.length) return;
  currentLevel = id;
  renderLevel(id);
  renderSidebar();
}

/* ============ MOBILE TOGGLE ============ */
document.getElementById("mobileToggle").addEventListener("click", ()=>{
  document.getElementById("sidebar").classList.toggle("open");
});

/* ============ INIT ============ */
renderSidebar();
renderLevel(currentLevel);
</script>
