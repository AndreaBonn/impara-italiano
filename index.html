<!DOCTYPE html>
<html lang="pl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- What this policy REALLY closes: `script-src 'self'` - the execution of code
     this directory did not provide. The course has not a single inline script and
     not a single on*= attribute, so standing at 'self' costs nothing.
     What it does NOT close: style. `style-src` must have 'unsafe-inline', because
     166 places in assets/js build a style="..." attribute out of computed values;
     neither a nonce nor a hash can come into being in a file with no server and no
     build step.
     What it is worth: with no server and no login there is nowhere for XSS to come
     from. What remains is a defence against foreign code attached from outside - a
     browser extension, or a dependency that some day arrives over the network.
     `frame-ancestors` is deliberately absent: browsers ignore it in <meta>, and a
     rule that does nothing looks in the list exactly like one that works.

     `connect-src` names four hosts, and that list is the honest statement of
     where this page can send anything. They are the four model providers a
     student may hand a key to for checking open answers; the course reaches them
     only after the student has entered a key and agreed. Note what the shape of
     this buys: the set of providers is closed HERE, by the browser, so no bug in
     the JavaScript can widen it. A wildcard would have cost nothing to write and
     given that up. `default-src 'self'` does not cover connect-src by extension —
     the directive is explicit, so it had to be edited by hand. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self' blob:; connect-src 'self' https://generativelanguage.googleapis.com https://api.groq.com https://api.openai.com https://api.anthropic.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title data-i18n="app.title">Impara l'Italiano 🇮🇹 — kurs włoskiego od A1 do C2</title>
<meta name="description" data-i18n-content="app.description" content="Kompletny kurs języka włoskiego po polsku: gramatyka, teoria, ćwiczenia, słuchanie i mówienie. Od A1 do poziomu native.">
<!-- The preview a shared link shows. Three things about it are deliberate.

     STATIC, with no `data-i18n`. Every other string on this page is rewritten
     by I18n.apply() at runtime; these are not, and could not be: a crawler
     reads the markup and never runs a line of our code, so a translated tag
     would reach it in whatever language the file was saved in. Marking them
     up as translatable would look right and change nothing.

     ENGLISH, while <title> above defaults to Polish. The two serve different
     people. The title belongs to a student who has already chosen a language;
     the preview belongs to whoever is being handed the link for the first
     time, and English is the one language this course can assume of someone
     who has not opened it yet. It is the same call manifest.webmanifest makes
     with "lang": "en-US". The course name itself stays Italian, as it does in
     the rail and in every language of the interface.

     ABSOLUTE URLs, which is the only place in this project where one appears.
     Crawlers do not resolve relative addresses. The prefix is not written by
     hand twice: it lives in "homepage" in package.json, and
     scripts/check_ogtags.mjs fails the build if these tags drift away from
     it, if the image is missing, or if it stops being exactly 1200x630. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Impara l'Italiano">
<meta property="og:url" content="https://andreabonn.github.io/impara-italiano/">
<meta property="og:title" content="Impara l'Italiano — a free Italian course, A1 to C2">
<meta property="og:description" content="An Italian course that runs in your browser, works offline, and explains the grammar in the language you already speak. No account, no tracking.">
<meta property="og:image" content="https://andreabonn.github.io/impara-italiano/assets/og/cover.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The name Impara l'Italiano over a warm cream background, next to a badge reading A1 to C2.">
<meta property="og:locale" content="en_US">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://andreabonn.github.io/impara-italiano/assets/og/cover.png">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#007a5e">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="assets/css/app.css">

</head>
<body>

<a class="skip-link" href="#main" data-i18n="app.skipToContent">Przejdź do treści</a>

</button>

<div class="shell">

      <p class="rail__tag" data-i18n="app.tagline">Włoski po polsku · A1 → C2</p>
      <!-- filled by app.js from I18n.LANGS: a new language needs no change in the HTML -->

      <button class="rail__search" id="railSearch" data-i18n-label="search.open" aria-label="Szukaj w kursie">
        <span aria-hidden="true">🔍</span><span data-i18n="search.open">Szukaj w kursie</span>
      </button>
    </div>

    <div class="rail__stats" id="railStats"></div>

    <ul class="rail__menu" id="railMenu">
      <li><button class="rail__item" data-route="oggi"><span class="rail__ico" aria-hidden="true">☀️</span><span data-i18n="nav.today">Dziś</span></button></li>
      <li><button class="rail__item" data-route="percorso"><span class="rail__ico" aria-hidden="true">🗺️</span><span data-i18n="nav.path">Ścieżka nauki</span></button></li>
      <li><button class="rail__item" data-route="ripasso"><span class="rail__ico" aria-hidden="true">🔁</span><span data-i18n="nav.review">Powtórki</span><span class="rail__badge" id="dueBadge" hidden>0</span></button></li>
      <li><button class="rail__item" data-route="cinque"><span class="rail__ico" aria-hidden="true">⏱️</span><span data-i18n="nav.flash">Pięć minut</span></button></li>
      <li><button class="rail__item" data-route="allenamento"><span class="rail__ico" aria-hidden="true">🎯</span><span data-i18n="nav.train">Trening</span></button></li>
      <li><button class="rail__item" data-route="conversazione"><span class="rail__ico" aria-hidden="true">🎙️</span><span data-i18n="nav.talk">Rozmowy na głos</span></button></li>
      <li><button class="rail__item" data-route="chiacchiere"><span class="rail__ico" aria-hidden="true">💬</span><span data-i18n="nav.chat">Swobodna rozmowa</span></button></li>
      <li><button class="rail__item" data-route="grammatica"><span class="rail__ico" aria-hidden="true">📐</span><span data-i18n="nav.grammar">Gramatyka</span></button></li>
      <li><button class="rail__item" data-route="coniugatore"><span class="rail__ico" aria-hidden="true">🧩</span><span data-i18n="nav.verbs">Odmiana czasowników</span></button></li>
      <li><button class="rail__item" data-route="lessico"><span class="rail__ico" aria-hidden="true">📖</span><span data-i18n="nav.lexicon">Mój słownik</span></button></li>
      <li><button class="rail__item" data-route="shadowing"><span class="rail__ico" aria-hidden="true">🗣️</span><span data-i18n="nav.shadow">Powtarzanie</span></button></li>
      <li><button class="rail__item" data-route="velocita"><span class="rail__ico" aria-hidden="true">⏩</span><span data-i18n="nav.speed">Tempo</span></button></li>
      <li><button class="rail__item" data-route="esame"><span class="rail__ico" aria-hidden="true">📋</span><span data-i18n="nav.exam">Egzamin</span></button></li>
      <li><button class="rail__item" data-route="falsi"><span class="rail__ico" aria-hidden="true">🪤</span><span data-i18n="nav.falsi">Fałszywi przyjaciele</span></button></li>
      <li><button class="rail__item" data-route="copertura"><span class="rail__ico" aria-hidden="true">📊</span><span data-i18n="nav.coverage">Pokrycie</span></button></li>
      <li><button class="rail__item" data-route="progressi"><span class="rail__ico" aria-hidden="true">🌸</span><span data-i18n="nav.progress">Postępy</span></button></li>
      <li><button class="rail__item" data-route="guida"><span class="rail__ico" aria-hidden="true">📖</span><span data-i18n="nav.guide">Przewodnik</span></button></li>
      <li><button class="rail__item" data-route="impostazioni"><span class="rail__ico" aria-hidden="true">⚙️</span><span data-i18n="nav.settings">Ustawienia</span></button></li>
    </ul>

    <div class="rail__foot">
      <button class="rail__theme" id="themeToggle" data-i18n-label="theme.toggle" aria-label="Przełącz motyw">🌙 Tryb nocny</button>
    </div>
  </nav>

  <div class="rail__scrim" id="railScrim" hidden></div>

  <!-- ══════════ MAIN ══════════ -->
  <div class="col">
    <main class="main" id="main" tabindex="-1"></main>

    <!-- The footer is a SIBLING of <main>, not a child of it: `Views.shell.set`
         replaces the innerHTML of #main at every route, so a footer living
         inside would vanish at the first change of screen and come back only
         on a reload. Standing here it is written once and shows on every
         screen.

         That property is the reason the privacy notice is linked from here
         and not from the rail: the rail lists things to do, and this is a
         thing to read, but it has to be one click away from wherever the
         student happens to be standing.

         The name needs no data-i18n, being a personal name. The link does,
         and gets it for free: I18n.apply() runs over the whole document,
         not over #main, so it reaches outside the part the router
         rewrites. -->
    <footer class="site-foot">
      <p>© <a href="https://github.com/AndreaBonn" target="_blank" rel="noopener">Andrea Bonacci</a>
        · <a href="#/privacy" data-i18n="privacy.title">Prywatność</a></p>
    </footer>
  </div>
</div>

<div class="toast-stack" id="toastStack" aria-live="polite" aria-atomic="false"></div>
